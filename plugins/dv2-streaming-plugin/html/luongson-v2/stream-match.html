<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuongSon — Live Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Momo+Trust+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="stream-match.css" />
  <script>
    window.DV2_TVC_VIDEOS = [
      '../../assets/images/tvc/cakhia_vebo/TVC_M9_Worldcup.mov'
    ];
    window.luongsonStreamMatch = {
      matchId: 'zp5rzghge5n8q82',
      apiBase: 'https://vsc-apidev.helizones.com/api/data/lives/',
      assetsUrl: '../../assets/images/luongson-v2/',
      imgUrl: 'images/',
      posterUrl: '../../assets/images/luongson-v2/bg-stream.webp',
      betImageUrl: '../../assets/images/luongson-v2/xo88.avif',
      playCtaUrl: '#',
      betUrl: '#',
      headerAdsAnimation: {
        url: '#',
        items: [
          { type: 'image', imageUrl: 'images/PUSEI2ZAlkDV8Tn0LUSpOKWlJMU_d2f4ba6f.png' },
          { type: 'text', text: '⚽️ Kèo thơm mỗi ngày • Nhận ưu đãi thành viên mới' },
          { type: 'image', imageUrl: 'images/PUSEI2ZAlkDV8Tn0LUSpOKWlJMU_d2f4ba6f.png' },
          { type: 'text', text: '• Soi kèo nhanh, tỷ lệ chuẩn • Tham gia ngay hôm nay 🔥' }
        ]
      }
    };
  </script>
</head>
<body>
  <div class="luongson-stream-match">
    <div class="luongson-stream-stage" id="luongsonStreamStage">
      <div class="luongson-stream-video-wrap">
        <div id="stream-player" class="luongson-stream-player-slot">
          <video
            id="liveVideo"
            class="luongson-stream-video"
            playsinline
            muted
            autoplay
            poster="../../assets/images/luongson-v2/bg-stream.webp"
          ></video>
        </div>

        <div class="luongson-stream-ui-layer">
        <div class="luongson-stream-loading" id="luongsonStreamLoading" hidden aria-live="polite">
          <div class="luongson-stream-loading__spinner" aria-hidden="true"></div>
          <p class="luongson-stream-loading__text">Đang tải luồng phát...</p>
        </div>

        <!-- Pre-match overlay (countdown / kickoff time) -->
        <div class="luongson-stream-prematch" id="luongsonStreamPreMatch" hidden aria-live="polite">
          <div class="luongson-stream-prematch__backdrop" aria-hidden="true"></div>
          <div class="luongson-stream-prematch__content">
            <div class="luongson-stream-prematch__league">
              <img
                class="luongson-stream-prematch__league-logo"
                id="luongsonPreMatchLeagueLogo"
                alt=""
                decoding="async"
                hidden
              />
              <span class="luongson-stream-prematch__league-name" id="luongsonPreMatchLeague">—</span>
            </div>

            <div class="luongson-stream-prematch__status" id="luongsonPreMatchStatus">
              <span class="luongson-stream-prematch__status-dot" aria-hidden="true"></span>
              <span class="luongson-stream-prematch__status-text" id="luongsonPreMatchStatusText">Chưa diễn ra</span>
            </div>

            <div class="luongson-stream-prematch__teams">
              <div class="luongson-stream-prematch__team luongson-stream-prematch__team--home">
                <div class="luongson-stream-prematch__team-logo">
                  <img id="luongsonPreMatchHomeLogo" alt="" decoding="async" />
                </div>
                <p class="luongson-stream-prematch__team-name" id="luongsonPreMatchHomeName">—</p>
              </div>

              <div class="luongson-stream-prematch__center" id="luongsonPreMatchCenter">
                <div class="luongson-stream-prematch__countdown" id="luongsonPreMatchCountdown" hidden>
                  <span class="luongson-stream-prematch__countdown-label">Bắt đầu sau</span>
                  <div class="luongson-stream-prematch__countdown-digits" aria-live="polite">
                    <span class="luongson-stream-prematch__digit" id="luongsonPreMatchCdH">00</span>
                    <span class="luongson-stream-prematch__digit-sep" aria-hidden="true">:</span>
                    <span class="luongson-stream-prematch__digit" id="luongsonPreMatchCdM">00</span>
                    <span class="luongson-stream-prematch__digit-sep" aria-hidden="true">:</span>
                    <span class="luongson-stream-prematch__digit" id="luongsonPreMatchCdS">00</span>
                  </div>
                </div>

                <div class="luongson-stream-prematch__datetime" id="luongsonPreMatchDatetime" hidden>
                  <span class="luongson-stream-prematch__datetime-value" id="luongsonPreMatchDatetimeVal">—</span>
                </div>

                <div class="luongson-stream-prematch__score" id="luongsonPreMatchScore" hidden>
                  <span class="luongson-stream-prematch__score-value" id="luongsonPreMatchScoreVal">0 - 0</span>
                </div>
              </div>

              <div class="luongson-stream-prematch__team luongson-stream-prematch__team--away">
                <div class="luongson-stream-prematch__team-logo">
                  <img id="luongsonPreMatchAwayLogo" alt="" decoding="async" />
                </div>
                <p class="luongson-stream-prematch__team-name" id="luongsonPreMatchAwayName">—</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Top ticker bar -->
        <div class="luongson-stream-top-bar" data-border="true">
          <div class="luongson-stream-ticker luongson-featured-ads-ticker">
            <a href="#" target="_blank" rel="noopener noreferrer">
              <ul>
                <li class="ticker-item"><span class="luongson-stream-ticker__dot"></span></li>
                <li class="ticker-item">
                  <img alt="" decoding="async" src="images/PUSEI2ZAlkDV8Tn0LUSpOKWlJMU_d2f4ba6f.png" height="26" />
                </li>
                <li class="ticker-item"><span class="luongson-stream-ticker__dot"></span></li>
                <li class="ticker-item">
                  <p class="luongson-stream-ticker__text">⚽️ Kèo thơm mỗi ngày • Nhận ưu đãi thành viên mới</p>
                </li>
                <li class="ticker-item"><span class="luongson-stream-ticker__dot"></span></li>
                <li class="ticker-item">
                  <img alt="" decoding="async" src="images/PUSEI2ZAlkDV8Tn0LUSpOKWlJMU_d2f4ba6f.png" height="26" />
                </li>
                <li class="ticker-item"><span class="luongson-stream-ticker__dot"></span></li>
                <li class="ticker-item">
                  <p class="luongson-stream-ticker__text">• Soi kèo nhanh, tỷ lệ chuẩn • Tham gia ngay hôm nay 🔥</p>
                </li>
              </ul>
            </a>
          </div>
          <a class="luongson-stream-play-cta" id="luongsonPlayCta" href="#" data-border="true" target="_blank" rel="noopener noreferrer">
            <span class="luongson-stream-play-cta__icon" aria-hidden="true">
              <img src="../../assets/images/luongson-v2/icon-play.svg" alt="" width="11" height="13" />
            </span>
            <span class="luongson-stream-play-cta__label">Chơi ngay</span>
          </a>
        </div>

        <!-- Bottom controls -->
        <div class="luongson-stream-bottom-bar">
          <div class="luongson-stream-bottom-left">
            <div class="luongson-match-commentator-container">
              <div class="luongson-match-commentator" id="luongsonStreamCommentator" data-commentator="">
                <button
                  type="button"
                  class="luongson-match-commentator-trigger"
                  id="luongsonCommentatorTrigger"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                >
                  <span class="luongson-match-commentator-avatar" data-border="true">
                    <img alt="" decoding="async" src="../../assets/images/luongson-v2/svg-blv.svg" />
                  </span>
                  <span class="luongson-match-commentator-name">—</span>
                  <svg class="luongson-match-commentator-chevron" role="presentation" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </button>
              </div>
            </div>

            <button type="button" class="luongson-stream-ctrl luongson-stream-ctrl--play is-paused" id="luongsonStreamPlay" aria-label="Phát" title="Phát">
              <img class="luongson-stream-ctrl__icon-play" src="../../assets/images/luongson-v2/icon-play.svg" alt="" width="20" height="20" />
              <svg class="luongson-stream-ctrl__icon-pause" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M4 2h3v12H4V2zm5 0h3v12H9V2z" />
              </svg>
            </button>

            <div class="luongson-stream-volume" id="luongsonStreamVolumeWrap">
              <button type="button" class="luongson-stream-ctrl luongson-stream-ctrl--volume is-muted" id="luongsonStreamVolume" aria-label="Bật tiếng" title="Âm lượng">
                <img class="luongson-stream-ctrl__icon-vol" src="../../assets/images/luongson-v2/icon-volume.svg" alt="" width="20" height="20" />
              </button>
              <input
                type="range"
                class="luongson-stream-volume__slider"
                id="luongsonStreamVolumeSlider"
                min="0"
                max="1"
                step="0.05"
                value="0"
                aria-label="Mức âm lượng"
              />
            </div>
          </div>

          <div class="luongson-stream-bottom-right">
            <div class="luongson-stream-odds-panel" id="luongsonStreamOdds" aria-label="Tỷ lệ kèo">
              <div class="luongson-stream-odds-row">
                <span class="luongson-stream-odds-label">FT</span>
                <span class="luongson-stream-odds-val" data-odds="hdp-home">-</span>
                <span class="luongson-stream-odds-val is-rate" data-odds="hdp-rate">-</span>
                <span class="luongson-stream-odds-val" data-odds="hdp-away">-</span>
              </div>
              <div class="luongson-stream-odds-row">
                <span class="luongson-stream-odds-label">HT</span>
                <span class="luongson-stream-odds-val" data-odds="ou-over">-</span>
                <span class="luongson-stream-odds-val is-rate" data-odds="ou-rate">-</span>
                <span class="luongson-stream-odds-val" data-odds="ou-under">-</span>
              </div>
            </div>

            <div class="luongson-stream-bottom-actions">
              <button type="button" class="luongson-stream-ctrl luongson-stream-ctrl--fs" id="luongsonStreamFs" aria-label="Toàn màn hình" title="Toàn màn hình">
                <img src="../../assets/images/luongson-v2/icon-zoom.svg" alt="" width="20" height="20" />
              </button>
              <a class="luongson-stream-bet-link" id="luongsonStreamBet" href="#" target="_blank" rel="noopener noreferrer">
                <span class="luongson-stream-bet-text">cược</span>
                <img class="luongson-stream-bet-logo" alt="XO88" decoding="async" src="../../assets/images/luongson-v2/xo88.avif" />
              </a>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="../shared/stream-tvc.js"></script>
  <script src="common.js"></script>
  <script src="stream-match.js"></script>
</body>
</html>
