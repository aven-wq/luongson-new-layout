<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuongSon — Đang phát sóng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Momo+Trust+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="match-modal.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
  <link rel="stylesheet" href="list-matches.css" />
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="luongson-list-matches" data-league-filter="1">
    <div class="luongson-list-matches__header">
      <h2 class="luongson-list-matches__title"> <span class="luongson-list-matches__live-dot" aria-hidden="true"></span> Đang phát sóng</h2>
      <div class="luongson-list-matches__league-filter">
        <label class="screen-reader-text" for="luongson-list-matches-league-select">Chọn giải đấu</label>
        <select
          id="luongson-list-matches-league-select"
          class="luongson-list-matches__league-select"
          data-placeholder="Chọn giải"
          aria-label="Chọn giải đấu"
        ></select>
      </div>
    </div>

    <div class="luongson-live-grid"></div>

    <div class="luongson-list-matches__footer">
      <button type="button" class="luongson-list-matches__load-more" hidden>
        Xem thêm
        <svg class="luongson-list-matches__load-more-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M4.29289 8.29289C4.68342 7.90237 5.31658 7.90237 5.70711 8.29289L12 14.5858L18.2929 8.29289C18.6834 7.90237 19.3166 7.90237 19.7071 8.29289C20.0976 8.68342 20.0976 9.31658 19.7071 9.70711L12.7071 16.7071C12.3166 17.0976 11.6834 17.0976 11.2929 16.7071L4.29289 9.70711C3.90237 9.31658 3.90237 8.68342 4.29289 8.29289Z" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    window.luongsonListMatches = { imgUrl: 'images/' };
  </script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.full.min.js"></script>
  <script src="common.js"></script>
  <script src="list-matches.js"></script>
</body>
</html>
