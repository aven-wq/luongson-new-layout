<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuongSon — Đang phát sóng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton+SC&family=Momo+Trust+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="list-matches.css" />
  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="luongson-list-matches">
    <div class="luongson-list-matches__header">
      <span class="luongson-list-matches__live-dot" aria-hidden="true"></span>
      <h2 class="luongson-list-matches__title">Đang phát sóng</h2>
    </div>

    <div class="luongson-live-grid">
      <div class="luongson-live-ads" data-framer-name="Ads">
        <a class="luongson-live-ad" href="#">
          <img alt="" decoding="async" height="200" src="images/ViT7ao3HygkYxpd18HxMZ7J8Xg_aeeeed03.png" width="1572" />
        </a>
        <a class="luongson-live-ad" href="#">
          <img alt="" decoding="async" height="180" src="images/Zb2hW4nkvPuYMPWvi0DWT9DMZus_14af5193.png" width="1456" />
        </a>
        <a class="luongson-live-ad luongson-live-ad--wide" href="#">
          <img alt="" decoding="async" height="200" src="images/8j10V9okmTsSFcWZ0yrFXX1Lw_1196fab1.png" width="1572" />
        </a>
      </div>
    </div>

    <div class="luongson-list-matches__footer">
      <button type="button" class="luongson-list-matches__load-more" hidden>
        Xem thêm
        <svg class="luongson-list-matches__load-more-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M4.29289 8.29289C4.68342 7.90237 5.31658 7.90237 5.70711 8.29289L12 14.5858L18.2929 8.29289C18.6834 7.90237 19.3166 7.90237 19.7071 8.29289C20.0976 8.68342 20.0976 9.31658 19.7071 9.70711L12.7071 16.7071C12.3166 17.0976 11.6834 17.0976 11.2929 16.7071L4.29289 9.70711C3.90237 9.31658 3.90237 8.68342 4.29289 8.29289Z" fill="currentColor" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    window.luongsonListMatches = { imgUrl: 'images/' };
  </script>
  <script src="common.js"></script>
  <script src="list-matches.js"></script>
</body>
</html>
