<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vebo</title>
    <link rel="stylesheet" href="../dist/dv2-style.css" />
  </head>

  <body>
    <div class="dv2-layout-vb dv2-home-matchs dv2-container">
      <!-- Tabs -->
      <div class="dv2-tabs">
        <button class="dv2-tab dv2-active">
          <span class="dv2-tab-icon">⚽</span>
          Bóng đá
        </button>
      </div>

      <!-- Filter bar -->
      <div class="dv2-filter-bar">
        <button class="dv2-filter-btn dv2-active" data-filter="live">
          <span style="color: #ff4757">⬤</span>
          LIVE
          <span class="dv2-filter-count">-</span>
        </button>
        <button class="dv2-filter-btn" data-filter="today">
          📅 Nay
          <span class="dv2-filter-count">-</span>
        </button>
        <button class="dv2-filter-btn" data-filter="all">
          Tất cả
          <span class="dv2-filter-count">-</span>
        </button>
      </div>

      <!-- Match grid -->
      <div class="dv2-match-grid" id="matchGrid"></div>
      <div class="dv2-loadmore">
        <button class="dv2-load-more-btn">
          Xem thêm
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-chevron-down"
          >
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../dist/dv2-script.min.js"></script>
  </body>
</html>
